name: Build SuperWall Kids Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'kids-v*'

permissions:
  contents: write

concurrency:
  group: superwall-kids-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SuperWall.Agent/SuperWall.Agent.csproj

      - name: Publish SuperWall Kids agent
        run: dotnet publish src/SuperWall.Agent/SuperWall.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/agent

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements --source winget

      - name: Build inner Inno installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs") | Where-Object { $_ -and (Test-Path $_) }
            $iscc = Get-ChildItem -Path $roots -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found after installation.' }
          New-Item -ItemType Directory -Force publish/installer/inner | Out-Null
          & $iscc installer/SuperWallKids.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $innerInstaller = 'publish/installer/SuperWall-Kids-Setup-0.4.8.exe'
          if (-not (Test-Path -LiteralPath $innerInstaller)) { throw "Inner installer was not created: $innerInstaller" }
          Move-Item $innerInstaller publish/installer/inner/SuperWall-Kids-Inner.exe -Force

      - name: Build temp-safe single-file bootstrapper
        shell: pwsh
        run: |
          dotnet publish installer/Bootstrapper/SuperWallInstallerBootstrapper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/installer/bootstrapper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bootstrapper = 'publish/installer/bootstrapper/SuperWallInstallerBootstrapper.exe'
          if (-not (Test-Path -LiteralPath $bootstrapper)) { throw "Bootstrapper executable was not created: $bootstrapper" }
          Copy-Item $bootstrapper publish/installer/SuperWall-Kids-Setup-0.4.8.exe -Force
          Remove-Item publish/installer/bootstrapper -Recurse -Force
          Remove-Item publish/installer/inner -Recurse -Force

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'publish/installer/SuperWall-Kids-Setup-0.4.8.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          if ((Get-Item $installer).Length -lt 1MB) { throw 'Installer unexpectedly small.' }
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Installer is not a valid Windows executable.' }

      - name: Generate SHA256
        shell: pwsh
        run: |
          (Get-FileHash publish/installer/SuperWall-Kids-Setup-0.4.8.exe -Algorithm SHA256).Hash | Out-File publish/installer/SHA256.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperWall-Kids-Installer
          path: |
            publish/installer/SuperWall-Kids-Setup-0.4.8.exe
            publish/installer/SHA256.txt

      - name: Publish GitHub release for kids tag
        if: startsWith(github.ref, 'refs/tags/kids-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            publish/installer/SuperWall-Kids-Setup-0.4.8.exe
            publish/installer/SHA256.txt
          body: |
            ## SuperWall Kids 0.4.8

            Windows client installer for SuperWall.

            - Fixes the Inno Setup upgrade crash caused by expanding `{app}` before initialization
            - Fixes existing-installation upgrade failures caused by a locked shared inner installer executable
            - Uses a unique temporary inner-installer directory for every bootstrapper run
            - Stops the existing SuperWall service before replacing the agent executable during upgrades
            - Preserves the dashboard, enrollment, target-user and policy behavior
            - Keeps enforcement scoped to the explicitly enrolled Windows account
            - Keeps browser URL blocking, download blocking and per-user policy enforcement
            - Self-contained Windows x64 agent
          generate_release_notes: false
          draft: false
          prerelease: false
