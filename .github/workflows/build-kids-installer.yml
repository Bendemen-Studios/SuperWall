name: Build SuperWall Kids Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'kids-v*'

permissions:
  contents: write

concurrency:
  group: superwall-kids-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read installer version
        shell: pwsh
        run: |
          $content = Get-Content -Raw installer/SuperWallKids.iss
          $match = [regex]::Match($content, '#define\s+MyAppVersion\s+"([^"]+)"')
          if (-not $match.Success) { throw 'Could not determine MyAppVersion from installer/SuperWallKids.iss.' }
          $version = $match.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') { throw "Invalid installer version: $version" }
          "INSTALLER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installer version: $version"

      - name: Restore
        run: dotnet restore src/SuperWall.Agent/SuperWall.Agent.csproj

      - name: Publish SuperWall Kids agent
        run: dotnet publish src/SuperWall.Agent/SuperWall.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/agent

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements --source winget

      - name: Build inner Inno installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs") | Where-Object { $_ -and (Test-Path $_) }
            $iscc = Get-ChildItem -Path $roots -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found after installation.' }
          New-Item -ItemType Directory -Force publish/installer/inner | Out-Null
          & $iscc installer/SuperWallKids.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $innerInstaller = Get-ChildItem -Path 'publish/installer' -Filter 'SuperWall-Kids-Setup-*.exe' -File |
            Where-Object { $_.Name -eq "SuperWall-Kids-Setup-$env:INSTALLER_VERSION.exe" } |
            Select-Object -First 1
          if (-not $innerInstaller) { throw "Inner installer for version $env:INSTALLER_VERSION was not created." }
          Move-Item -LiteralPath $innerInstaller.FullName -Destination 'publish/installer/inner/SuperWall-Kids-Inner.exe' -Force

      - name: Build temp-safe single-file bootstrapper
        shell: pwsh
        run: |
          dotnet publish installer/Bootstrapper/SuperWallInstallerBootstrapper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/installer/bootstrapper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bootstrapper = Get-ChildItem -Path 'publish/installer/bootstrapper' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $bootstrapper) { throw 'Bootstrapper executable was not created.' }
          Copy-Item -LiteralPath $bootstrapper.FullName -Destination "publish/installer/SuperWall-Kids-Setup-$env:INSTALLER_VERSION.exe" -Force
          Remove-Item publish/installer/bootstrapper -Recurse -Force
          Remove-Item publish/installer/inner -Recurse -Force

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "publish/installer/SuperWall-Kids-Setup-$env:INSTALLER_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer not found: $installer" }
          if ((Get-Item $installer).Length -lt 1MB) { throw 'Installer unexpectedly small.' }
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Installer is not a valid Windows executable.' }

      - name: Prepare installer checksum
        shell: pwsh
        run: |
          (Get-FileHash "publish/installer/SuperWall-Kids-Setup-$env:INSTALLER_VERSION.exe" -Algorithm SHA256).Hash | Out-File publish/installer/SHA256.txt
          (Get-FileHash "publish/agent/SuperWall.Agent.exe" -Algorithm SHA256).Hash | Out-File publish/installer/SHA256-Agent.txt
          Copy-Item publish/agent/SuperWall.Agent.exe "publish/installer/SuperWall-Agent-win-x64.exe" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperWall-Kids-Installer
          path: |
            publish/installer/SuperWall-Kids-Setup-${{ env.INSTALLER_VERSION }}.exe
            publish/installer/SHA256.txt
            publish/installer/SuperWall-Agent-win-x64.exe
            publish/installer/SHA256-Agent.txt

      - name: Publish GitHub release for kids tag
        if: startsWith(github.ref, 'refs/tags/kids-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            publish/installer/SuperWall-Kids-Setup-${{ env.INSTALLER_VERSION }}.exe
            publish/installer/SHA256.txt
            publish/installer/SuperWall-Agent-win-x64.exe
            publish/installer/SHA256-Agent.txt
          body: |
            ## SuperWall Kids ${{ env.INSTALLER_VERSION }}

            Windows client for SuperWall.

            - Silent installer for initial enrollment
            - Installerless agent self-update from the GitHub release asset
            - Update is SHA256 verified and staged by Windows for the next restart
            - Installed application inventory support
            - Existing browser, download, URL and app policy enforcement retained
            - Self-contained Windows x64 agent
          generate_release_notes: false
          draft: false
          prerelease: false
