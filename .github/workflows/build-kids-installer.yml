name: Build SuperWall Kids Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'kids-v*'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SuperWall.Agent/SuperWall.Agent.csproj

      - name: Publish SuperWall Kids agent
        run: dotnet publish src/SuperWall.Agent/SuperWall.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/agent

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements

      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found.' }
          New-Item -ItemType Directory -Force publish/installer | Out-Null
          & $iscc installer/SuperWallKids.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'publish/installer/SuperWall-Kids-Setup-0.3.0.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $size = (Get-Item $installer).Length
          if ($size -lt 1MB) { throw "Installer unexpectedly small: $size bytes" }
          Write-Host "Installer verified: $size bytes"

      - name: Generate SHA256
        shell: pwsh
        run: |
          Get-FileHash publish/installer/SuperWall-Kids-Setup-0.3.0.exe -Algorithm SHA256 |
            Format-Table -AutoSize |
            Out-File publish/installer/SHA256.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperWall-Kids-Installer
          path: publish/installer/*

      - name: Publish GitHub release for kids tag
        if: startsWith(github.ref, 'refs/tags/kids-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/installer/SuperWall-Kids-Setup-0.3.0.exe
            publish/installer/SHA256.txt
          generate_release_notes: true
