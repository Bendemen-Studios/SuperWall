name: Build SuperWall Kids Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'kids-v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SuperWall.Agent/SuperWall.Agent.csproj

      - name: Publish SuperWall Kids agent
        run: dotnet publish src/SuperWall.Agent/SuperWall.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/agent

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements --source winget

      - name: Build inner Inno installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs") | Where-Object { $_ -and (Test-Path $_) }
            $iscc = Get-ChildItem -Path $roots -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found after installation.' }
          New-Item -ItemType Directory -Force publish/installer/inner | Out-Null
          & $iscc installer/SuperWallKids.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item publish/installer/SuperWall-Kids-Setup-0.4.6.exe publish/installer/inner/SuperWall-Kids-Inner.exe -Force

      - name: Build temp-safe single-file bootstrapper
        shell: pwsh
        run: |
          dotnet publish installer/Bootstrapper/SuperWallInstallerBootstrapper.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/installer/bootstrapper
          Copy-Item publish/installer/bootstrapper/SuperWall-Kids-Setup-0.4.6.exe publish/installer/SuperWall-Kids-Setup-0.4.6.exe -Force
          Remove-Item publish/installer/bootstrapper -Recurse -Force
          Remove-Item publish/installer/inner -Recurse -Force

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'publish/installer/SuperWall-Kids-Setup-0.4.6.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          if ((Get-Item $installer).Length -lt 1MB) { throw 'Installer unexpectedly small.' }

      - name: Generate SHA256
        shell: pwsh
        run: |
          (Get-FileHash publish/installer/SuperWall-Kids-Setup-0.4.6.exe -Algorithm SHA256).Hash | Out-File publish/installer/SHA256.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperWall-Kids-Installer
          path: |
            publish/installer/SuperWall-Kids-Setup-0.4.6.exe
            publish/installer/SHA256.txt

      - name: Publish GitHub release for kids tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/kids-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kids-v0.4.6
          target_commitish: ${{ github.sha }}
          files: |
            publish/installer/SuperWall-Kids-Setup-0.4.6.exe
            publish/installer/SHA256.txt
          body: |
            ## SuperWall Kids 0.4.6

            Windows client installer for SuperWall.

            - Fixes elevated-installer account targeting by carrying the interactive Windows username through UAC elevation
            - Keeps enforcement scoped to the explicitly enrolled Windows account instead of replacing it with the active admin account
            - Loads the enrolled user's profile hive when required for per-user browser policy
            - Blocks configured domains such as YouTube through Chromium browser policy and the local HTTPS proxy
            - Disables QUIC and browser DoH while URL blocking is enabled so HTTPS traffic cannot bypass the proxy
            - Restarts managed browsers when the effective policy changes
            - Blocks Chromium browser downloads when download blocking is enabled
            - Keeps DownloadGuard as a filesystem fallback for the enrolled user's Downloads folder
            - Removes legacy machine-wide SuperWall browser policies during upgrade
            - Secure automatic update checks every 6 hours
            - Self-contained Windows x64 agent
          generate_release_notes: false
          draft: false
          prerelease: false
