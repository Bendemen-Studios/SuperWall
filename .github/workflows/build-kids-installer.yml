name: Build SuperWall Kids Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'kids-v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SuperWall.Agent/SuperWall.Agent.csproj

      - name: Publish SuperWall Kids agent
        run: dotnet publish src/SuperWall.Agent/SuperWall.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/agent

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements --source winget

      - name: Build EXE installer
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs") | Where-Object { $_ -and (Test-Path $_) }
            $iscc = Get-ChildItem -Path $roots -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found after installation.' }
          & $iscc installer/SuperWallKids.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = 'publish/installer/SuperWall-Kids-Setup-0.4.3.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          if ((Get-Item $installer).Length -lt 1MB) { throw 'Installer unexpectedly small.' }

      - name: Generate SHA256
        shell: pwsh
        run: |
          (Get-FileHash publish/installer/SuperWall-Kids-Setup-0.4.3.exe -Algorithm SHA256).Hash | Out-File publish/installer/SHA256.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperWall-Kids-Installer
          path: publish/installer/*

      - name: Publish GitHub release for kids tag
        if: startsWith(github.ref, 'refs/tags/kids-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kids-v0.4.3
          files: |
            publish/installer/SuperWall-Kids-Setup-0.4.3.exe
            publish/installer/SHA256.txt
          body: |
            ## SuperWall Kids 0.4.3

            Windows client installer for SuperWall.

            - Fixes direct navigation to blocked domains such as YouTube when URL blocking is enabled
            - Refreshes Chromium/Edge policy immediately after a policy change
            - URL blocking and download blocking remain independently configurable per device
            - Global Policy keeps both switches enabled by default for devices
            - Adds permanent device deletion from the dashboard
            - Enrollment keys can be copied directly from the dashboard
            - Browser URL/download enforcement remains scoped to the enrolled Windows account
            - Parent/private Windows accounts are not affected by SuperWall Chromium policies
            - DownloadGuard only monitors the enrolled Kids user's Downloads folder
            - Removes legacy machine-wide SuperWall browser policies during upgrade
            - Secure automatic update checks every 6 hours
            - SHA256 verification before installation
            - Self-contained Windows x64 agent
          generate_release_notes: false
          draft: false
          prerelease: false
